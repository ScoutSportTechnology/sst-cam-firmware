# Docker Compose file for the SST Cam Firmware devcontainer.
# devcontainer.json points here via "dockerComposeFile" and attaches to "app".
#
# The image is a thin layer over the published compiler image (see
# .devcontainer/Dockerfile), so the build context is just .devcontainer/.
# The ~/.conan2 host-cache bind and the .bashrc bind are declared in
# devcontainer.json instead, since they need ${localEnv}/${localWorkspaceFolder}
# devcontainer token substitution that plain compose can't do.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sst-cam-firmware
    stdin_open: true
    tty: true
    volumes:
      - ..:/workspace:cached
