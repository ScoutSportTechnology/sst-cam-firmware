# =============================================================================
# release-beta — the single product workflow that OWNS the `release/**` branches.
#
# It carries two responsibilities, gated by event type:
#
#   * PULL REQUESTS into `release/**` run the CI CHECK jobs (`ci-scripts`,
#     `format`, `tidy`, `test`). These four job `name:` values are the REQUIRED
#     STATUS CHECK contexts wired into the branch rulesets (see
#     docs/ci/rulesets.md) — keep them BYTE-IDENTICAL; renaming silently breaks
#     branch protection.
#
#   * PUSHES to a `release/X.Y.Z` branch run the beta RELEASE job: resolve the
#     next `vX.Y.Z-beta.N` tag, cross-build the aarch64 binary inside the
#     compiler image, record its SHA-256 in the Release notes, and publish it as a
#     PRERELEASE asset. This is the exact binary that release.yml later copies
#     onto the stable Release — no rebuild on `main`.
#
# The check jobs are PR-only (`if: github.event_name == 'pull_request'`) and the
# release job is push/dispatch-only (`if: github.event_name != 'pull_request'`),
# so on any single run exactly one half is active. The release job deliberately
# does NOT `needs:` the check jobs — they are SKIPPED on push, and a `needs:` on
# a skipped job would block the release. The PR's own green checks are the gate.
#
# The base version X.Y.Z is the release branch's own name (release/X.Y.Z), NOT a
# commit scan: a release branch IS the declaration of its target version. A
# branch name that is not `release/X.Y.Z` fails fast (the shared resolver rejects
# a malformed beta base).
#
# INTEGRITY HAND-OFF: this workflow records the published binary's SHA-256 in the
# Release notes (`sha256: <hex>`). release.yml downloads the asset, recomputes
# its SHA-256, and verifies it against this recorded digest before re-uploading
# to the stable Release. Tag immutability protects the *tag*, not the Release
# *asset* — a later `--clobber` upload could swap the asset — so the digest
# compare makes promotion a verified hand-off, not trust-on-download.
#
# beta = the second rung of the maturity ladder: this binary is flashed to a
# real Jetson and tested with the app before a maintainer opens the
# `release/X.Y.Z -> main` PR.
#
# WHY the compiler image: the Jetson aarch64 cross-build is only correct inside
# the repo's compiler image (gcc-13 aarch64 cross toolchain, the order-sensitive
# L4T sysroot prep scripts, host-protoc codegen, OpenCV SONAME pin, Conan cache).
# So every cross-build gotcha stays solved in one place (see AGENTS.md).
#
# COMPILER IMAGE: ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler, built
# and published only by compiler-image.yml from compiler-image/ (tag =
# compiler-image/VERSION, immutable). The `image` job resolves the tag, checks
# the devcontainer pins the same one and that it is published; tidy/test/
# cross-build `needs:` it and `docker pull`+`docker run` the image (no sysroot
# build here). format + ci-scripts are host-only (no image). SECURITY: consumers
# pull a pinned version tag (never a mutable `:latest`).
# =============================================================================
name: release-beta

on:
  pull_request:
    branches: ["release/**"]
  push:
    branches: ["release/**"]
    # Docs-only pushes don't change the binary — skip the beta cross-build + tag so
    # a docs/markdown merge doesn't cut a throwaway vX.Y.Z-beta.N. Beta derives its
    # version from the branch name (every push bumps), so unlike alpha it cannot
    # skip via conventional-commit type — this paths filter is the guard. A mixed
    # push (code AND docs) still builds (paths-ignore skips only when EVERY changed
    # path matches).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Serialize betas on the same release branch; cancel a superseded push/PR run.
concurrency:
  group: release-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Published cross-compiler image (recipe: compiler-image/, published by
  # compiler-image.yml). Tag = compiler-image/VERSION, resolved by the `image`
  # job; tidy/test/release pull it.
  IMAGE: ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler

jobs:
  # ===========================================================================
  # image — resolve the compiler image tag (compiler-image/VERSION), check that
  # the devcontainer pins the same tag, and fail fast if it is not published.
  # The image is built only by compiler-image.yml (whenever compiler-image/
  # changes); tidy/test/release `needs:` this job and pull `${IMAGE}:<tag>`.
  # ===========================================================================
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve compiler image tag
        id: tag
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < compiler-image/VERSION)"
          dev="$(sed -n 's#^FROM ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler:\([^ ]*\).*#\1#p' .devcontainer/Dockerfile)"
          if [ "$dev" != "$tag" ]; then
            echo "::error::.devcontainer/Dockerfile uses compiler image tag '${dev}' but compiler-image/VERSION is '${tag}'"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the tag is published
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null; then
            echo "::error::${IMAGE}:${TAG} is not published. The compiler-image workflow publishes it on any push that changes compiler-image/; re-run this job once it is green."
            exit 1
          fi

  # ===========================================================================
  # changes — detect whether a PR touches build-relevant paths. The EXPENSIVE
  # checks (tidy ~21 min, test ~16 min) gate on `code`; a docs/workflow-only PR
  # skips them. A job SKIPPED by `if:` counts as SUCCESS for required status
  # checks (only a never-reported/pending check blocks the merge), so the wired
  # `tidy`/`test` names stay green on a docs-only PR without running. The cheap
  # checks (ci-scripts 6 s, format 17 s, image 8 s cache-hit) stay always-on.
  # ===========================================================================
  changes:
    name: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Filter build-relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '.devcontainer/**'
              - 'compiler-image/**'
              - 'conanfile.py'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - 'proto/**'
              - 'scripts/**'
              - '.github/workflows/**'

  # ===========================================================================
  # CI CHECK JOBS — PR-only. The job names below (`ci-scripts`, `format`,
  # `tidy`, `test`) are the REQUIRED STATUS CHECKS wired into the branch
  # rulesets (see docs/ci/rulesets.md) — keep them BYTE-IDENTICAL.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # ci-scripts — gate the CI/deploy scripts (shellcheck + self-tests) and the
  # proto/ contract pin. Host-side only (no devcontainer). This is a
  # SEPARATE job; it must NOT be merged into format/tidy/test, whose names are
  # the wired required status checks.
  # ---------------------------------------------------------------------------
  ci-scripts:
    name: ci-scripts
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck tidy-run + proto-pin + deploy scripts
        run: shellcheck scripts/ci/tidy-run.sh scripts/ci/test-tidy-run.sh scripts/ci/check-proto-pin.sh deploy/install.sh deploy/install-test.sh

      # Contract pin: proto/ must point at a commit merged into the sst-cam-proto
      # branch with the same name as this PR's base (development or
      # release/X.Y.Z). Version math lives in ScoutSportTechnology/.github.
      - name: proto pin check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: ./scripts/ci/check-proto-pin.sh "$BASE_REF"

      # Selection/sharding self-test for tidy-run.sh (R-SELECT): asserts the
      # shard split covers every TU exactly once and that an unwired TU fails.
      # Host-side (pure bash + the synthetic trees it builds) — no devcontainer.
      - name: tidy-run selection self-test
        run: ./scripts/ci/test-tidy-run.sh

      - name: install.sh runtime-dep contract tests
        run: ./deploy/install-test.sh

  # ---------------------------------------------------------------------------
  # format — clang-format dry-run (Google style, .clang-format) over src/+tests/
  # ---------------------------------------------------------------------------
  format:
    name: format
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      # clang-format is a HOST tool — no cross sysroot needed. ubuntu-24.04 ships
      # clang-format-18 (matches the devcontainer's noble clang-format), so run it
      # on the runner directly instead of building/pulling the ~15 GB image.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format-18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-format-18

      - name: clang-format --dry-run --Werror
        run: |
          set -euo pipefail
          files=$(find src tests \
            \( -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.h' \) \
            -not -path '*/_old/*')
          if [ -z "$files" ]; then
            echo "No C++ sources found to format-check"; exit 1
          fi
          echo "$files" | xargs clang-format-18 --dry-run --Werror

  # ---------------------------------------------------------------------------
  # tidy — clang-tidy over the test preset's compile_commands.json, SHARDED.
  #
  # clang-tidy cost scales with TU COUNT: ~95 TUs each re-parse the heavy
  # GStreamer/OpenCV headers, so a single-job full scan is ~21 min flat. We keep
  # FULL-TREE coverage (no diff-scope, no coverage hole — "green = clean tree"
  # stays true) and instead SPLIT the TU list across a runner matrix:
  # `tidy-shard` lints round-robin slices in parallel (scripts/ci/tidy-run.sh),
  # cutting lint wall-time ~Nx, and the `tidy` AGGREGATOR fails iff any shard
  # failed.
  #
  # `tidy` (NOT `tidy-shard`) is the wired REQUIRED STATUS CHECK — a matrix job
  # reports as `tidy-shard (0)`, `tidy-shard (1)`, … which would NOT satisfy the
  # branch ruleset. Keep the aggregator's `name: tidy` byte-identical (see
  # docs/ci/rulesets.md). Retune the shard count by editing the matrix `shard:`
  # list ALONE — `${{ strategy.job-total }}` derives the total from that list and
  # passes it to tidy-run.sh, so the index and total cannot drift.
  # ---------------------------------------------------------------------------
  tidy-shard:
    name: tidy-shard
    needs: [changes, image]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Hard gate: the cross-toolchain flags (scripts/tidy-args.sh) resolve all
    # std/system headers, the tree is clean, and .clang-tidy promotes every
    # diagnostic to an error via WarningsAsErrors. A new lint violation in ANY
    # shard fails the run. clang-tidy is noble clang-tidy v18 (see .clang-tidy).
    strategy:
      # One shard's violation must not cancel the others — collect every shard's
      # findings in a single run instead of stopping at the first failure.
      fail-fast: false
      matrix:
        # The shard TOTAL is derived from this list via ${{ strategy.job-total }}
        # and passed to tidy-run.sh, so the index and the total can never drift
        # (a hardcoded total is a silent-coverage-hole hazard). Retune by editing
        # this list alone. Entries MUST be the contiguous range 0..N-1 — the
        # round-robin covers bins 0..total-1, and any gap/out-of-range fails
        # CLOSED (tidy-run.sh rejects an index >= total).
        shard: [0, 1, 2, 3]
    steps:
      # The compiler image is ~5.2 GB compressed / ~10.7 GB unpacked; a stock
      # hosted runner has ~14 GB free. Reclaim ~30GB of preinstalled toolchains first.
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # Register qemu-aarch64 in the host binfmt_misc so aarch64 binaries started
      # inside the container run (ctest also wraps the test binaries in qemu).
      - name: Set up QEMU (arm64 binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the published compiler image (tag from the `image` job), then run
      # this shard inside it — no per-run sysroot rebuild on the fast path. Run as
      # root so the bind-mounted workspace (owned by the runner uid) is writable
      # for the build dir; the image's PATH already exposes conan + the gcc-13
      # cross toolchain. tidy-run.sh builds (cmake + sst_proto) then lints only
      # this shard's slice.
      - name: Pull compiler image
        uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}

      - name: clang-tidy shard ${{ matrix.shard }} of ${{ strategy.job-total }} (-p build/test)
        env:
          TAG: ${{ needs.image.outputs.tag }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.conan2":/root/.conan2 -e CONAN_HOME=/root/.conan2 \
            -e SHARD="${SHARD}" -e TOTAL="${TOTAL}" \
            "${IMAGE}:${TAG}" bash -lc 'set -euo pipefail
              # clang-tidy is an editor/lint tool, not part of the compiler image:
              # install noble v18 (same version as the devcontainer) for this shard.
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends clang-tidy >/dev/null
              scripts/ci/tidy-run.sh shard "${SHARD}" "${TOTAL}"'

  # ---------------------------------------------------------------------------
  # tidy — AGGREGATOR + floor-NOLINT guard. This is the wired REQUIRED STATUS
  # CHECK (name byte-identical; see docs/ci/rulesets.md). Host-side only — no
  # devcontainer. `if: always()` is load-bearing: a FAILED shard must not
  # skip-propagate through `needs:` and turn this job into a green "skipped"
  # (a job skipped by an unmet `needs:` counts as SUCCESS for required checks).
  # So we run regardless and assert the shard aggregate result ourselves.
  # ---------------------------------------------------------------------------
  tidy:
    name: tidy
    needs: [changes, tidy-shard]
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history so the floor-NOLINT guard can diff against the PR base.
          fetch-depth: 0

      # Self-test the guard before trusting it: asserts every bypass class
      # (bare/wildcard/non-leading-list NOLINT, faked marker) is still caught.
      # A regex regression here would silently let unsanctioned floor NOLINTs
      # through the gate.
      - name: Floor-NOLINT guard self-test
        run: scripts/test-check-floor-nolints.sh

      # Cheap, host-side gate — no devcontainer needed. Fails the PR if it adds a
      # bugprone-*/performance-* NOLINT without a `// floor-ok:` sanction marker
      # (see .clang-tidy floor policy). Diff-scoped against the PR base, so only
      # newly introduced suppressions are gated.
      - name: Floor-NOLINT guard (diff-scoped)
        run: scripts/check-floor-nolints.sh "${{ github.event.pull_request.base.sha }}"

      # The merge gate: fail unless EVERY shard succeeded. `needs.tidy-shard.result`
      # is the matrix aggregate — "success" only when all legs passed.
      - name: Assert all tidy shards passed
        run: |
          set -euo pipefail
          result="${{ needs.tidy-shard.result }}"
          echo "tidy-shard aggregate result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::one or more tidy shards did not pass (${result})"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # test — cross-build the test preset and run GTest under qemu (ctest)
  # ---------------------------------------------------------------------------
  test:
    name: test
    needs: [changes, image]
    # always(): if `image` fails, a plain `needs:` would SKIP this required check,
    # and a skipped check counts as success. Run anyway and fail on the first step.
    if: ${{ always() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Require the compiler image
        if: ${{ needs.image.result != 'success' }}
        run: |
          echo "::error::the image job did not succeed (${{ needs.image.result }}): the compiler image tag is not usable."
          exit 1

      # The compiler image is ~5.2 GB compressed / ~10.7 GB unpacked; a stock
      # hosted runner has ~14 GB free. Reclaim ~30GB of preinstalled toolchains first.
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-

      # Register qemu-aarch64 in the host binfmt_misc so aarch64 binaries started
      # inside the container run (ctest also wraps the test binaries in qemu).
      - name: Set up QEMU (arm64 binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the published compiler image (tag from the `image` job), then run the cross-build + ctest inside it —
      # no per-run sysroot rebuild on the fast path. ctest runs the aarch64 GTest
      # binaries under qemu (host binfmt from setup-qemu-action); QEMU_LD_PREFIX
      # points the emulator at the L4T targetfs for shared libs. Hardware-bound
      # tests (real IMX477 / BlueZ / radio / live GStreamer) fail in the cross
      # container — see AGENTS.md — so the known names are excluded by -E.
      # DURABLE FIX (firmware owner): tag them `LABELS hardware` + switch to -LE.
      - name: Pull compiler image
        uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}

      - name: cmake test preset + build + ctest (qemu)
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.conan2":/root/.conan2 -e CONAN_HOME=/root/.conan2 \
            -e QEMU_LD_PREFIX=/l4t/targetfs \
            "${IMAGE}:${TAG}" bash -lc '
              set -euo pipefail
              cmake --preset test
              cmake --build --preset test
              ctest --preset test --output-on-failure \
                -E "RawCaptureSinkE2E|CaptureSingleFrameAndLog|AdvertisesOnRealBluez|FormsAutonomousGroupOwner|HttpServesByteRangeWithBearerToken"'

  # ===========================================================================
  # BETA RELEASE JOBS — push/dispatch-only. NOT gated behind the check jobs:
  # the checks are SKIPPED on push, so a `needs:` on them would block release.
  # The PR's own green checks (run above on the PR) are the gate.
  # ===========================================================================
  resolve:
    name: resolve beta/rc version
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # mode: release takes X.Y.Z from the release/X.Y.Z branch name (fails fast
      # on any other shape) and mints beta.N, or rc.N once promote-rc.yml
      # re-tagged the hardware-validated beta as rc.1.
      - name: Resolve next beta or rc tag
        id: ver
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: release

  build-and-upload:
    name: cross-build beta binary
    needs: [resolve, image]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the release asset
      packages: read # pull the compiler image
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      # Reclaim disk before pulling the prebuilt image (no sysroot rebuild here).
      - name: Free up disk space (host)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout (with proto submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the published compiler image (tag from the `image` job), then run the release cross-build inside it —
      # no per-run sysroot rebuild on the fast path. The binary lands in the
      # bind-mounted build/ on the host for the staging step below.
      - name: Pull compiler image
        uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}

      - name: cmake release preset + build
        env:
          IMG_TAG: ${{ needs.image.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "$PWD":/workspace -w /workspace \
            -v "$HOME/.conan2":/root/.conan2 -e CONAN_HOME=/root/.conan2 \
            "${IMAGE}:${IMG_TAG}" bash -lc '
              set -euo pipefail
              cmake --preset release
              cmake --build --preset release
              test -x build/release/bin/sst_cam_firmware'

      - name: Stage versioned asset
        id: asset
        run: |
          set -euo pipefail
          asset="sst_cam_firmware-${TAG}-aarch64"
          cp build/release/bin/sst_cam_firmware "${asset}"
          echo "path=${asset}" >> "$GITHUB_OUTPUT"

      # publish-release (ScoutSportTechnology/.github) creates the Release as a
      # draft, uploads the binary, records `sha256: <hex>  <asset>` in the notes
      # (the digest promote verifies) and only then publishes it, so a cancel
      # can't leave an asset-less tag.
      - name: Publish beta/rc prerelease (binary + SHA-256)
        uses: ScoutSportTechnology/.github/actions/publish-release@v1.1.0
        with:
          tag: ${{ env.TAG }}
          files: ${{ steps.asset.outputs.path }}
          prerelease: "true"
          notes: |
            Prerelease for hardware sign-off.

            ## Install on a JetPack 7.2 Jetson

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ScoutSportTechnology/sst-cam-firmware/{tag}/deploy/install.sh | sudo bash -s -- --version {tag}
            ```
