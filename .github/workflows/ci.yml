name: ci

on:
  pull_request:
    branches: [development, 'release/**', main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

env:
  IMAGE: ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler

jobs:
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'conanfile.py'
              - 'proto/**'
              - 'compiler-image/**'
              - '.devcontainer/**'
              - 'scripts/**'
              - 'justfile'
              - '.github/workflows/**'
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < compiler-image/VERSION)"
          dev="$(sed -n 's#^FROM ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler:\([^ ]*\).*#\1#p' .devcontainer/Dockerfile)"
          test "$tag" = "$dev"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null

  lint:
    needs: [changes, image]
    if: ${{ always() && (github.base_ref == 'main' || github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.image.result }}' = success && { test '${{ github.event_name }}' != pull_request || test '${{ needs.changes.result }}' = success; }
      - if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}
      - env:
          TAG: ${{ needs.image.outputs.tag }}
          BASE: ${{ github.event.pull_request.base.sha || 'origin/development' }}
          BASE_REF: ${{ github.base_ref || 'development' }}
          CHANGED: ${{ github.event_name == 'pull_request' && github.base_ref == 'development' }}
        run: |
          docker run --rm --network host --user root -v "$PWD":/workspace -w /workspace \
            -e BASE -e BASE_REF -e CHANGED \
            "${IMAGE}:${TAG}" bash -lc 'set -euo pipefail; apt-get update -qq; apt-get install -y -qq --no-install-recommends just clang-tidy clang-format shellcheck >/dev/null; just lint ${CHANGED:+changed}'
      - if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

  format:
    if: ${{ always() && github.base_ref == 'main' }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.lint.result }}' = success

  tidy:
    if: ${{ always() && github.base_ref == 'main' }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.lint.result }}' = success

  ci-scripts:
    if: ${{ always() && github.base_ref == 'main' }}
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.lint.result }}' = success

  compile:
    needs: [changes, image]
    if: ${{ always() && github.base_ref != 'main' && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.image.result }}' = success && { test '${{ github.event_name }}' != pull_request || test '${{ needs.changes.result }}' = success; }
      - if: ${{ !env.ACT }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}
      - env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          docker run --rm --network host --user root -v "$PWD":/workspace -w /workspace \
            "${IMAGE}:${TAG}" bash -lc 'set -euo pipefail; apt-get update -qq; apt-get install -y -qq --no-install-recommends just >/dev/null; just compile'

  test:
    needs: [changes, image]
    if: ${{ always() && (github.base_ref == 'main' || github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ github.base_ref == 'main' }}
        run: test '${{ needs.lint.result }}' = success
      - if: ${{ github.base_ref != 'main' }}
        run: test '${{ needs.image.result }}' = success && { test '${{ github.event_name }}' != pull_request || test '${{ needs.changes.result }}' = success; }
      - if: ${{ github.base_ref != 'main' }}
        run: test '${{ needs.image.result }}' = success && { test '${{ github.event_name }}' != pull_request || test '${{ needs.changes.result }}' = success; }
      - if: ${{ github.base_ref != 'main' && !env.ACT }}
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - if: ${{ github.base_ref != 'main' }}
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: ${{ github.base_ref != 'main' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - if: ${{ github.base_ref != 'main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ github.base_ref != 'main' }}
        uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}
      - if: ${{ github.base_ref != 'main' }}
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          docker run --rm --network host --user root -v "$PWD":/workspace -w /workspace \
            -e QEMU_LD_PREFIX=/l4t/targetfs \
            "${IMAGE}:${TAG}" bash -lc 'set -euo pipefail; apt-get update -qq; apt-get install -y -qq --no-install-recommends just >/dev/null; just test'
