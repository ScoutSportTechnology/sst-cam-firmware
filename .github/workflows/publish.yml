name: publish

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: boolean
        required: true
      notes:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: boolean
        required: true
        default: true
      notes:
        type: string
        required: false

permissions:
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          large-packages: true
          docker-images: false
          swap-storage: true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          submodules: recursive
      - if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}")"
      - id: image
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < compiler-image/VERSION)"
          dev="$(sed -n 's#^FROM ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler:\([^ ]*\).*#\1#p' .devcontainer/Dockerfile)"
          test "$tag" = "$dev"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pull-compiler-image
        with:
          image: ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler
          tag: ${{ steps.image.outputs.tag }}
      - env:
          TAG: ${{ steps.image.outputs.tag }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          docker run --rm --user root -v "$PWD":/workspace -w /workspace \
            -e SST_RELEASE_TAG="$RELEASE_TAG" \
            ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler:"${TAG}" \
            bash -lc 'set -euo pipefail; apt-get update -qq; apt-get install -y -qq --no-install-recommends just >/dev/null; just build'
      - id: asset
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          asset="dist/sst_cam_firmware-${TAG}-aarch64"
          mv dist/sst_cam_firmware-aarch64 "$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"
      - uses: ScoutSportTechnology/.github/actions/publish-release@v1.1.0
        with:
          tag: ${{ inputs.tag }}
          files: ${{ steps.asset.outputs.path }}
          prerelease: ${{ inputs.prerelease }}
          notes: ${{ inputs.notes }}
