# =============================================================================
# release — publish on development/release branches; promote only on main.
#
# On push to main (the release/X.Y.Z -> main merge) the shared promote action finds the
# highest vX.Y.Z-rc.N (the hardware-validated candidate), verifies the SHA-256
# of its binary against the digest recorded in that Release, tags vX.Y.Z on the
# same commit and attaches the same bytes renamed to sst_cam_firmware-vX.Y.Z-
# aarch64. It refuses to promote a version that never reached rc.
#
# Two invariants: `main` runs no failable build, and no CI job pushes a commit
# back to `main`. Never add a cmake/compiler-image step here.
#
# After promotion (manual follow-up): delete release/X.Y.Z and open a
# `main -> development` PR.
# =============================================================================
name: release

on:
  push:
    branches: [development, 'release/**', main]
  workflow_dispatch:
    inputs:
      to:
        description: Release level to promote
        type: choice
        options: [publish, rc]
        default: publish
      bump:
        description: Force alpha base bump
        type: string
        required: false
      version:
        description: "X.Y.Z to promote (overrides detection from the merge commit)"
        required: false
        default: ""

# Never run two promotions at once (they'd race on the stable tag/Release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

jobs:
  version:
    if: ${{ (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/heads/release/')) && inputs.to != 'rc' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.ver.outputs.released }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        uses: ScoutSportTechnology/.github/actions/resolve-version@v1.1.0
        with:
          mode: ${{ github.ref == 'refs/heads/development' && 'alpha' || 'release' }}
          version: ${{ inputs.version }}
          bump: ${{ inputs.bump }}

  publish:
    needs: version
    if: ${{ needs.version.outputs.tag != '' && needs.version.outputs.released == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      prerelease: true
      notes: |
        Prerelease for hardware sign-off.

        ## Install on a JetPack 7.2 Jetson

        ```bash
        curl -fsSL https://raw.githubusercontent.com/ScoutSportTechnology/sst-cam-firmware/{tag}/deploy/install.sh | sudo bash -s -- --version {tag}
        ```
    secrets: inherit

  promote-rc:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.to == 'rc' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ScoutSportTechnology/.github/actions/promote@v1.1.0
        with:
          to: rc

  promote:
    name: tag stable + copy rc binary (no build)
    if: ${{ github.ref == 'refs/heads/main' && inputs.to != 'rc' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote the last rc to stable
        id: promote
        uses: ScoutSportTechnology/.github/actions/promote@v1.1.0
        with:
          to: stable
          version: ${{ inputs.version }}
          notes: |
            ## Install on a JetPack 7.2 Jetson

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ScoutSportTechnology/sst-cam-firmware/{tag}/deploy/install.sh | sudo bash -s -- --version {tag}
            ```

      - name: Post-promotion reminder (manual maintainer steps)
        run: |
          {
            echo "## Promoted ${{ steps.promote.outputs.tag }} (from ${{ steps.promote.outputs.source }})"
            echo ""
            echo "- Delete the merged \`release/${{ steps.promote.outputs.base }}\` branch."
            echo "- Open a \`main -> development\` PR so the stable tag's history is in the integration branch."
          } >> "$GITHUB_STEP_SUMMARY"
