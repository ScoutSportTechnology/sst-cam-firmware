name: lint-full

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          set -euo pipefail
          tag="$(tr -d '[:space:]' < compiler-image/VERSION)"
          dev="$(sed -n 's#^FROM ghcr.io/scoutsporttechnology/sst-cam-firmware-compiler:\([^ ]*\).*#\1#p' .devcontainer/Dockerfile)"
          test "$tag" = "$dev"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}" >/dev/null

  lint:
    needs: image
    if: ${{ needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pull-compiler-image
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ needs.image.outputs.tag }}
      - env:
          TAG: ${{ needs.image.outputs.tag }}
          BASE: origin/development
          BASE_REF: development
        run: |
          docker run --rm --user root -v "$PWD":/workspace -w /workspace \
            -e BASE -e BASE_REF \
            "${IMAGE}:${TAG}" bash -lc 'set -euo pipefail; apt-get update -qq; apt-get install -y -qq --no-install-recommends just clang-tidy clang-format shellcheck >/dev/null; scripts/ci/tidy-run.sh shard "${{ matrix.shard }}" 4'